name: Bug report
description: Report a reproducible production, packaging, or deterministic-tooling defect
title: "[bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Production problem
      description: What happened, and at which production stage?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe example that reproduces it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
